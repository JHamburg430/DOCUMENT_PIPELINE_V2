groups:
  - name: manuals-rag-availability
    rules:
      - alert: ManualsRagApiDown
        expr: up{job="api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Manuals RAG API is unreachable
          description: The API scrape target has been down for more than two minutes.

      - alert: ManualsRagNotReady
        expr: max_over_time(manuals_readiness_ready[5m]) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Manuals RAG is not ready
          description: The API has reported a failed readiness state for five minutes.

  - name: manuals-rag-quality
    rules:
      - alert: ManualsRagQueryLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(manuals_query_duration_seconds_bucket{stage="full"}[10m]))) > 120
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Manuals RAG query latency is high
          description: Full-query p95 latency has exceeded 120 seconds for ten minutes.

      - alert: ManualsRagAbstentionRateHigh
        expr: rate(manuals_answer_abstain_total[10m]) / clamp_min(rate(manuals_query_duration_seconds_count{stage="full"}[10m]), 1) > 0.50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Manuals RAG abstention rate is high
          description: More than half of observed full-query requests have abstained for ten minutes.

      - alert: ManualsRagAgenticControllerErrors
        expr: increase(manuals_agentic_retrieval_runs_total{outcome="controller_error"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Manuals RAG agentic controller errors detected
          description: Agentic controller errors have occurred in the last ten minutes.
