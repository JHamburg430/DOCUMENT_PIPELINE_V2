{
  "name": "PROVIS Inference Node CI",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "main",
        "codex/provis-production-updates-20261017"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "provis-ci-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "test-and-package": {
      "if": "${{ false }}",
      "name": "Bootstrap hold \u2014 approve CI cost before enabling",
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 45,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": [
            "ubuntu-22.04",
            "windows-2022"
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Linux Tk/display support",
          "if": "runner.os == 'Linux'",
          "run": "sudo apt-get update\nsudo apt-get install --yes python3-tk xvfb"
        },
        {
          "name": "Pinned build/test and existing ONNX runtime dependencies",
          "run": "python -m pip install -r manuals_rag/requirements-node-ci.txt -r manuals_rag/requirements-inference-onnx.txt"
        },
        {
          "name": "Linux source and frozen-package checks",
          "if": "runner.os == 'Linux'",
          "run": "xvfb-run --auto-servernum python manuals_rag/scripts/provis_release_pipeline.py ci --packaging --evidence-dir \"${{ runner.temp }}/provis-ci-evidence\""
        },
        {
          "name": "Windows source, app and full-installer checks",
          "if": "runner.os == 'Windows'",
          "run": "python manuals_rag/scripts/provis_release_pipeline.py ci --packaging --evidence-dir \"${{ runner.temp }}/provis-ci-evidence\""
        },
        {
          "name": "Retain unsigned test evidence only",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "provis-ci-evidence-${{ matrix.os }}",
            "path": "${{ runner.temp }}/provis-ci-evidence",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
