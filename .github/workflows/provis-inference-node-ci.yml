name: PROVIS Inference Node CI

on:
  pull_request:
    paths:
      - "manuals_rag/packages/inference_fabric/**"
      - "provis_inference_node/src/provis_inference_node/openai_broker.py"
      - "provis_inference_node/src/provis_inference_node/endpoint_ui.py"
      - "manuals_rag/scripts/build_inference_node_*.py"
      - "manuals_rag/scripts/build_provis_node_windows_installer.py"
      - "manuals_rag/windows_installer/**"
      - "manuals_rag/tests/unit/test_provis_node_windows_installer.py"
      - "manuals_rag/tests/unit/test_inference_node_*.py"
      - "manuals_rag/tests/unit/test_inference_native_linux_updates.py"
      - "manuals_rag/requirements-node-ci.txt"
      - ".github/workflows/provis-inference-node-ci.yml"
  push:
    branches:
      - main
      - master
      - codex/provis-node-reconcile-20261017
    paths:
      - "manuals_rag/packages/inference_fabric/**"
      - "provis_inference_node/src/provis_inference_node/openai_broker.py"
      - "provis_inference_node/src/provis_inference_node/endpoint_ui.py"
      - "manuals_rag/scripts/build_inference_node_*.py"
      - "manuals_rag/scripts/build_provis_node_windows_installer.py"
      - "manuals_rag/windows_installer/**"
      - "manuals_rag/tests/unit/test_provis_node_windows_installer.py"
      - "manuals_rag/tests/unit/test_inference_node_*.py"
      - "manuals_rag/tests/unit/test_inference_native_linux_updates.py"
      - "manuals_rag/requirements-node-ci.txt"
      - ".github/workflows/provis-inference-node-ci.yml"

permissions:
  contents: read

concurrency:
  group: provis-inference-node-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Python, Tk, and display support
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-venv python3-tk xvfb
          python3 -m venv --system-site-packages "$RUNNER_TEMP/provis-node-ci-venv"
          echo "$RUNNER_TEMP/provis-node-ci-venv/bin" >> "$GITHUB_PATH"
      - name: Install focused build and test dependencies
        run: python -m pip install -r manuals_rag/requirements-node-ci.txt
      - name: Run updater, gateway, listener, and desktop UI tests
        env:
          PYTHONPATH: manuals_rag/packages/inference_fabric/src:manuals_rag/scripts:provis_inference_node/src
        run: |
          xvfb-run --auto-servernum python -m pytest -q \
            manuals_rag/tests/unit/test_inference_node_updates.py \
            manuals_rag/tests/unit/test_inference_node_listener_refresh.py \
            manuals_rag/tests/unit/test_inference_native_linux_updates.py \
            manuals_rag/tests/unit/test_inference_node_broker_gateway.py \
            manuals_rag/tests/unit/test_installer_release.py
      - name: Build unsigned Linux smoke artifact
        env:
          PYTHONPATH: manuals_rag/packages/inference_fabric/src:manuals_rag/scripts:provis_inference_node/src
        run: |
          python manuals_rag/scripts/build_inference_node_linux.py \
            --gateway-url https://gateway.invalid:8445 \
            --output "$RUNNER_TEMP/PROVISInferenceNode-unsigned"
          test -x "$RUNNER_TEMP/PROVISInferenceNode-unsigned"
          sha256sum "$RUNNER_TEMP/PROVISInferenceNode-unsigned" > "$RUNNER_TEMP/PROVISInferenceNode-unsigned.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: PROVISInferenceNode-unsigned-linux-x86_64
          path: |
            ${{ runner.temp }}/PROVISInferenceNode-unsigned
            ${{ runner.temp }}/PROVISInferenceNode-unsigned.sha256
          if-no-files-found: error
          retention-days: 7

  windows-installer-smoke:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused build and test dependencies
        run: python -m pip install -r manuals_rag/requirements-node-ci.txt
      - name: Run Windows installer unit tests including real Tk GUI startup
        env:
          PYTHONPATH: manuals_rag/packages/inference_fabric/src;provis_inference_node/src
        run: python -m pytest -q manuals_rag/tests/unit/test_provis_node_windows_installer.py
      - name: Build unsigned Windows installer smoke artifact
        env:
          PYTHONPATH: manuals_rag/packages/inference_fabric/src
        run: |
          python manuals_rag/scripts/build_provis_node_windows_installer.py --output "$env:RUNNER_TEMP\PROVISInferenceNodeInstaller.exe"
          $installer = "$env:RUNNER_TEMP\PROVISInferenceNodeInstaller.exe"
          if (-not (Test-Path $installer)) { throw "Installer build output missing" }
          python manuals_rag/scripts/verify_provis_node_windows_installer_archive.py $installer
          $env:PYTHONPATH = ""
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Push-Location $env:RUNNER_TEMP
          # This initializes the packaged Tk window and closes it automatically;
          # it never invokes Install / Repair or launches the node application.
          $selfTest = Start-Process -FilePath $installer -ArgumentList '--self-test' -PassThru -Wait
          Pop-Location
          if ($selfTest.ExitCode -ne 0) { throw "Frozen installer self-test failed with exit code $($selfTest.ExitCode)" }
          Get-FileHash $installer -Algorithm SHA256 | Format-List
